[project]
name = "gnostr"
version = "0.1.0"
description = "A Nostr client for GNOME"
requires-python = ">=3.10"
dependencies = [
    "ecdsa",
    "websocket-client",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src.gnostr"]

[tool.hatch.build.targets.sdist]
include = ["src/gnostr"]

[tool.black]
line-length = 88
target-version = ['py311']
include = '\.pyi?$'
exclude = '''
/(
    \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.venv
  | build
  | dist
)/
'''

[tool.ruff]
line-length = 88
target-version = "py311"
lint.select = ["E", "F", "I", "N", "UP", "B", "C4", "DTZ", "EXE", "G", "PGH", "SIM", "TID", "ERA", "PERF", "RSE", "PYI", "SLOT", "FLY", "ANN", "ARG", "PTH", "PIE", "PT", "Q", "RSE", "RUF", "T20", "UP"]
lint.ignore = ["SIM105", "RUF001", "RUF003", "B008", "ANN101", "ANN102", "ARG001", "ARG002", "PT011", "RUF012"]
lint.per-file-ignores = {"__init__.py" = ["F401"], "tests/*" = ["ANN201", "ANN202", "S101"]}

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
follow_imports = "skip"
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true

[tool.pytest.ini_options]
pythonpath = ["src"]
