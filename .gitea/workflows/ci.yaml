name: CI

on:
  push:
    branches: [main, main_refactor, refactor-ui-components]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Install system dependencies
      run: |
        # Removed 'sudo' since Gitea runner containers execute as root by default
        apt-get update
        
        # Install Python 3.11, Flatpak builder, and all GTK/GStreamer dependencies natively
        apt-get install -y \
          python3.11 python3.11-venv python3-pip \
          xvfb \
          flatpak flatpak-builder \
          libgtk-4-dev \
          libadwaita-1-dev \
          libcairo2-dev \
          libgirepository1.0-dev \
          libgstreamer1.0-dev \
          libgstreamer-plugins-base1.0-dev \
          gstreamer1.0-plugins-base \
          gstreamer1.0-plugins-good \
          gstreamer1.0-plugins-bad \
          gstreamer1.0-plugins-ugly \
          gstreamer1.0-libav \
          gcc
          
        # Ensure 'python3' points to the newly installed Python 3.11 environment
        update-alternatives --install /usr/bin/python3 python3 /usr/bin/python3.11 1
    
    - name: Install Python dependencies
      run: |
        python3 -m pip install --upgrade pip
        python3 -m pip install pytest black flake8 PyGObject
    
    - name: Lint codebase
      run: |
        black --check src/ tests/ || true
        flake8 src/ tests/ --max-line-length=120 || true
    
    - name: Run tests with xvfb
      id: run_tests
      run: |
        PYTHONPATH=. xvfb-run --auto-servernum pytest tests/ -v --tb=short > test_report.log
    
    - name: Build Flatpak
      run: |
        flatpak remote-add --user --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo
        flatpak-builder --force-clean --repo=repo build_dir tech.livingonlinux.gnostr.json
        
    - name: Dispatch Hermes AI Repair Webhook
      if: failure()
      run: |
        touch test_report.log 
        
        curl -X POST http://your-hermes-agent-url:8080/webhook/repair \
        -H "Content-Type: application/json" \
        -d '{
          "repository": "${{ github.repository }}",
          "branch": "${{ github.ref_name }}",
          "commit_sha": "${{ github.sha }}",
          "report": "'"$(cat test_report.log | base64)"'"
        }'