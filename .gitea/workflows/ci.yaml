name: CI

on:
  push:
    branches: [main, main_refactor, refactor-ui-components]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    # FIXED: Using a container image that has Node pre-installed so actions work,
    # but uses a modern Ubuntu base so our apt-get dependencies resolve perfectly.
    container: catthehacker/ubuntu:act-22.04
    
    steps:
    - name: Check out repository code
      uses: actions/checkout@v4
    
    - name: Install system dependencies
      run: |
        export DEBIAN_FRONTEND=noninteractive
        apt-get update
        
        # Install Python 3, Flatpak, and modern GTK4/GStreamer stacks
        apt-get install -y \
          python3 python3-venv python3-pip \
          xvfb \
          flatpak flatpak-builder \
          libgtk-4-dev \
          libadwaita-1-dev \
          libcairo2-dev \
          libgirepository1.0-dev \
          libgstreamer1.0-dev \
          libgstreamer-plugins-base1.0-dev \
          gstreamer1.0-plugins-base \
          gstreamer1.0-plugins-good \
          gstreamer1.0-plugins-bad \
          gstreamer1.0-plugins-ugly \
          gstreamer1.0-libav \
          gcc \
          curl
    
    - name: Install Python dependencies
      run: |
        python3 -m pip install --upgrade pip
        python3 -m pip install pytest black flake8 PyGObject
    
    - name: Lint codebase
      run: |
        black --check src/ tests/ || true
        flake8 src/ tests/ --max-line-length=120 || true
    
    - name: Run tests with xvfb
      id: run_tests
      run: |
        PYTHONPATH=. xvfb-run --auto-servernum pytest tests/ -v --tb=short > test_report.log
    
    - name: Build Flatpak
      run: |
        flatpak remote-add --user --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo
        flatpak-builder --force-clean --repo=repo build_dir tech.livingonlinux.gnostr.json
        
    - name: Dispatch Hermes AI Repair Webhook
      if: failure()
      run: |
        touch test_report.log 
        
        # Be sure to swap this with your actual Hermes instance/network orchestration endpoint
        curl -X POST http://192.168.5.134:8080/webhook/repair \
        -H "Content-Type: application/json" \
        -d '{
          "repository": "${{ github.repository }}",
          "branch": "${{ github.ref_name }}",
          "commit_sha": "${{ github.sha }}",
          "report": "'"$(cat test_report.log | base64)"'"
        }'