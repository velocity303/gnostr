name: CI

on:
  push:
    branches: [main, main_refactor, refactor-ui-components]
  pull_request:
    branches: [main]

env:
  GITEA_HOST: 192.168.5.134
  GITEA_URL: http://${{ env.GITEA_HOST }}:3000

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Test connectivity to Gitea
        run: |
          curl -f ${GITEA_URL}/api/v1/user || echo "Gitea not accessible"

      - name: Checkout repository code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.TOKEN }}

      - name: Install system dependencies
        run: |
          export DEBIAN_FRONTEND=noninteractive
          apt-get update

          apt-get install -y \
            python3 python3-dev python3-venv python3-pip pkg-config \
            xvfb \
            flatpak flatpak-builder \
            libgtk-4-dev \
            libadwaita-1-dev \
            libcairo2-dev \
            libgirepository1.0-dev \
            libgstreamer1.0-dev \
            libgstreamer-plugins-base1.0-dev \
            gstreamer1.0-plugins-base \
            gstreamer1.0-plugins-good \
            gstreamer1.0-plugins-bad \
            gstreamer1.0-plugins-ugly \
            gstreamer1.0-libav \
            gcc \
            curl \
            libglib2.0-dev

      - name: Install Flatpak SDKs
        run: |
          flatpak install -y flathub org.gnome.Sdk//50 org.gnome.Platform//50

      - name: Install Python dependencies
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install -e .

      - name: Install test tools
        run: |
          python3 -m pip install pytest black flake8 PyGObject

      - name: Lint codebase
        run: |
          black --check src/ tests/ || true
          flake8 src/ tests/ --max-line-length=120 || true

      - name: Run tests with xvfb
        id: run_tests
        run: |
          PYTHONPATH=. xvfb-run -a pytest tests/ -v --tb=short > test_report.log

      - name: Create Repair Issue on Failure
        if: failure() && steps.run_tests.outcome == 'failure'
        run: |
          touch test_report.log
          echo "Creating repair issue for CI failure..."

          export REPO_PATH="${{ github.repository }}"
          export BRANCH="${{ github.ref_name }}"
          export COMMIT_SHA="${{ github.sha }}"

          python3 scripts/create_issue_payload.py > issue_payload.json

          curl -X POST "${GITEA_URL}/api/v1/repos/VelocityNet/gnostr/issues" \
            -H "Authorization: token ${{ secrets.TOKEN }}" \
            -H "Content-Type: application/json" \
            -d @issue_payload.json

      - name: Build Flatpak
        if: success()
        run: |
          flatpak remote-add --user --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo
          flatpak-builder --force-clean --repo=repo build_dir tech.livingonlinux.gnostr.json
