name: CI

on:
  push:
    branches: [main, main_refactor, refactor-ui-components]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    container: catthehacker/ubuntu:act-22.04

    steps:
    - name: Check out repository code
      uses: actions/checkout@v4

    - name: Install system dependencies
      run: |
        export DEBIAN_FRONTEND=noninteractive
        apt-get update

        # Added python3-dev to provide Python.h for PyGObject/Pycairo compilation
        apt-get install -y \
          python3 python3-dev python3-venv python3-pip pkg-config \
          xvfb \
          flatpak flatpak-builder \
          libgtk-4-dev \
          libadwaita-1-dev \
          libcairo2-dev \
          libgirepository1.0-dev \
          libgstreamer1.0-dev \
          libgstreamer-plugins-base1.0-dev \
          gstreamer1.0-plugins-base \
          gstreamer1.0-plugins-good \
          gstreamer1.0-plugins-bad \
          gstreamer1.0-plugins-ugly \
          gstreamer1.0-libav \
          gcc \
          curl

    - name: Install Python dependencies
      run: |
        python3 -m pip install --upgrade pip
        python3 -m pip install pytest black flake8 PyGObject

    - name: Lint codebase
      run: |
        black --check src/ tests/ || true
        flake8 src/ tests/ --max-line-length=120 || true

    - name: Run tests with xvfb
      id: run_tests
      run: |
        PYTHONPATH=. xvfb-run --auto-servernum pytest tests/ -v --tb=short > test_report.log

    - name: Create Repair Issue on Failure
      if: failure() && steps.run_tests.outcome == 'failure'
      run: |
        touch test_report.log
        echo "Creating repair issue for CI failure..."

        # Get repository info
        REPO_PATH="${{ github.repository }}"
        BRANCH="${{ github.ref_name }}"
        COMMIT_SHA="${{ github.sha }}"
        TEST_REPORT=$(cat test_report.log)

        # Create issue via GitHub API (Gitea compatible)
        curl -X POST "https://api.github.com/repos/$REPO_PATH/issues" \
          -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
          -H "Content-Type: application/json" \
          -d "{\"title\": \"CI Failure: Repair needed for $BRANCH\", \"body\": \"## CI Repair Request\n\nRepository: $REPO_PATH\nBranch: $BRANCH\nCommit: $COMMIT_SHA\n\n### Test Report\n\`\`\`\n$TEST_REPORT\n\`\`\`\n\n### Instructions for Repair Agent\n1. Analyze the test failures in the report above\n2. Identify the root cause\n3. Create a fix that addresses the failing tests\n4. Submit a PR to branch $BRANCH with the fix\n5. Ensure all tests pass before submitting\n\n### Labels to Add\n- needs-repair\n- ci-failure\n\n---\n*This issue was automatically created by the CI pipeline.*\", \"labels\": [\"needs-repair\", \"ci-failure\"]}"

    - name: Build Flatpak
      if: success()
      run: |
        flatpak remote-add --user --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo
        flatpak-builder --force-clean --repo=repo build_dir tech.livingonlinux.gnostr.json
