name: CI

on:
  push:
    branches: [main, main_refactor, refactor-ui-components]
  pull_request:
    branches: [main]

env:
  GITEA_HOST: ${{secrets.HOST}}
  GITEA_URL: http://${{ env.GITEA_HOST }}:3000

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Test connectivity to Gitea
        run: |
          curl -f ${GITEA_URL}/api/v1/user || echo "Gitea not accessible"

      - name: Checkout repository code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.TOKEN }}

      - name: Install system dependencies
        run: |
          export DEBIAN_FRONTEND=noninteractive
          apt-get update
          
          # 1. Install prerequisites for adding repositories
          apt-get install -y software-properties-common
          
          # 2. Add the Deadsnakes PPA which archives older Python versions
          add-apt-repository ppa:deadsnakes/ppa -y
          apt-get update

          # 3. Install Python 3.10 alongside your build tools
          apt-get install -y \
            python3.10 python3.10-dev python3.10-venv python3.10-distutils pkg-config \
            xvfb \
            flatpak flatpak-builder \
            gcc \
            curl \
            libglib2.0-dev

          # 4. Bootstrap pip for Python 3.10
          curl -sS https://bootstrap.pypa.io/get-pip.py | python3.10

      - name: Add flathub remote
        run: |
          flatpak remote-add --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo

      - name: Install Flatpak SDKs
        run: |
          flatpak install -y flathub org.gnome.Sdk//50 org.gnome.Platform//50

      - name: Install Python dependencies
        run: |
          python3.10 -m pip install --upgrade pip
          python3.10 -m pip install -e .

      - name: Install test tools
        run: |
          python3.10 -m pip install pytest black flake8 PyGObject

      - name: Lint codebase
        run: |
          python3.10 -m black --check src/ tests/ || true
          python3.10 -m flake8 src/ tests/ --max-line-length=120 || true

      - name: Run tests with xvfb
        id: run_tests
        run: |
          PYTHONPATH=. python3.10 -